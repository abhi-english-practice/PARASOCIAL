on('#prev',()=>move(-1));on('#next',()=>move(1));on('#hint',()=>{showHint=!showHint;render()});on('#answer',()=>{showAnswer=!showAnswer;render()});on('#sentencevi',()=>{showVI=!showVI;render()});on('#clear',()=>{resetExercise();render()});
on('#check',()=>{let s=D.sentences[idx],ok=mode==='build'?chosen.length===s.chunks.length&&chosen.every((v,i)=>v===i):normal(typed)===normal(s.parts[part]);if(ok)done.add(mode==='build'?'b'+idx:'t'+idx+'-'+part);render();feedback(ok?'Correct · matches the source.':mode==='build'?'Not yet in the source order. Try again.':'Not yet a match. Check missing words and word forms.',ok)});
on('#flip',()=>{stopRecording();flip=!flip;render()});on('#cardprev',()=>{stopRecording();ci=Math.max(0,ci-1);flip=false;render()});on('#cardnext',()=>{stopRecording();ci=Math.min(listCards().length-1,ci+1);flip=false;render()});on('#shuffle',()=>{stopRecording();cardOrder=shuffled(cardOrder);ci=0;flip=false;render()});on('#resetcards',()=>{stopRecording();status={};cardOrder=D.cards.map((_,i)=>i);ci=0;filter='all';flip=false;render()});let fs=$('#filter');if(fs)fs.onchange=()=>{stopRecording();filter=fs.value;ci=0;flip=false;render()};for(let state of ['review','remembered'])on('#'+state,()=>{stopRecording();status[listCards()[ci]]=state;flip=false;render()});
document.querySelectorAll('[data-color]').forEach(b=>{b.onpointerdown=e=>e.preventDefault();b.onclick=()=>{if(!selected.length)return;history.push({...colors});selected.forEach(k=>{if(b.dataset.color)colors[k]=b.dataset.color;else delete colors[k]});window.getSelection().removeAllRanges();selected=[];render()}});on('#undo',()=>{if(history.length){colors=history.pop();render()}});on('#clearcolors',()=>{history.push({...colors});colors={};render()});}
document.addEventListener('selectionchange',()=>{const s=window.getSelection();if(!s.rangeCount||s.isCollapsed)return;const r=s.getRangeAt(0);selected=[...document.querySelectorAll('.word')].filter(n=>r.intersectsNode(n)).map(n=>n.dataset.word)});
document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>{stopRecording();mod=b.dataset.module;showVI=showHint=showAnswer=flip=false;selected=[];render()});$('#globalvi').onclick=()=>{vi=!vi;render()};$('#reset').onclick=()=>{vi=false;idx=part=ci=0;mode='build';done.clear();status={};filter='all';colors={};history=[];selected=[];cardOrder=D.cards.map((_,i)=>i);flip=false;resetExercise();render()};resetExercise();render();
</script></html>
